        <title>css grid </title>
        <style>
            .container{

               grid-template-columns: 1fr 1fr 1fr;
            }
            .box{

                width:45vw;

                background-color: white;
                display: flex;
            
            }

                height: 30px;

            }
            .big{
                font-size: xx-large;
            }
        
            .small{
                font-size:xx-small;
            }
            .text{
                display: flex;
                flex-direction: column;
            }
            .button{
                text-decoration: none;
                  color: black !important;
                width:7px;
                display: flex;
                text-align: center;
                margin: 15px;
                padding: 12px;
            }
            .yellow{
                display: flex;
              
                background-color: yellow;
                border: none;
                padding: 8px 14px;
                border-radius: 5px;
                font-weight: bold;
            }
            .white{
                 background-color: white;
                border: 2px solid yellow;
                padding: 8px 14px;
                border-radius: 5px;

        </style>
