<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale="1.0">
        <title></title>
        <style>
            :root{
                --primary-color:rgb(2, 118, 176);
                --text-color:white;
                --secondary-color:rgb(0, 162, 255);
            }
            body{
                background-color: var(--secondary-color);
            }
            @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik+Spray+Paint&display=swap');

          *{
                margin: 0;
                padding: 0

            }
            nav{
                background-color: var(--primary-color);
                padding: 12px 0;
            }
            ul li{
                list-style: none;
                font-weight: bolder;
            }
             
            ul li{
                display: inline;
                padding: 23px ;

            }
            ul li a{
                   color: var(--text-color);
                   text-decoration: none;
            }
            
        </style>
    </head>
    <body>
        <header>
            <nav>
                <ul>
                    <li><a>home</a></li>
                    <li><a>about</a></li>
                    <li><a>service</a></li>
                    <li><a>contact us</a></li>
                </ul>
            </nav>
        </header>
    </body>
    </html>
